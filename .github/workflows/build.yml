name: build

on:
  push:
    branches: [main]
    tags: ["v*", "V*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach awinput-win.zip to (e.g. v1.0.1)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with the in-box .NET Framework compiler
        shell: cmd
        run: build.bat --no-shortcuts

      - name: Smoke test
        shell: pwsh
        run: |
          if (-not (Test-Path bin\awinput.exe)) { throw "bin\awinput.exe was not built" }
          $p = Start-Process bin\awinput.exe -ArgumentList '--version' -Wait -PassThru -NoNewWindow
          Write-Host "awinput --version exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "awinput --version exited $($p.ExitCode)" }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item bin\awinput.exe, README.md, LICENSE, streamdeck\make-shortcuts.bat dist\
          Compress-Archive dist\* awinput-win.zip

      - uses: actions/upload-artifact@v4
        with:
          name: awinput-win
          path: awinput-win.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: awinput-win.zip
